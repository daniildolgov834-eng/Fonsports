<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FONBET</title>
    <!-- Иконка -->
    <link rel="icon" href="./game_icon.png?v=1" type="image/png" />
    
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/hack-font@3/build/web/hack.css"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Hack", ui-monospace, "Cascadia Code", "SF Mono", Menlo,
          Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        color: #edf3ff;
        background: #050814;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }

      .pygodide-shell {
        margin: 0;
        padding: 0;
        width: 360px;
        height: 640px;
        flex-shrink: 0;
        position: relative;
      }

      .pygodide-stage {
        position: relative;
        margin: 0;
        padding: 0;
        width: 360px;
        height: 640px;
      }

      /* Контейнер загрузчика (скрыт, нужен для boot.js) */
      #pygodide-loader {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background-color: #050814;
        transition: opacity 300ms ease-out;
      }

      #pygodide-loader[data-state="hidden"] {
        opacity: 0;
        visibility: hidden;
      }

      /* Скрываем визуальные элементы, оставляя их для boot.js */
      #pygodide-brand,
      #status,
      #pygodide-progress,
      #pygodide-progress-fill {
        opacity: 0 !important;
        pointer-events: none !important;
      }

      #pygodide-version {
        display: none !important;
      }

      #canvas {
        display: block;
        margin: 0;
        padding: 0;
        border: 0;
        background: #050814;
        width: 360px;
        height: 640px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <main class="pygodide-shell">
      <div class="pygodide-stage">
        <div id="pygodide-loader" data-state="active">
          <a id="pygodide-brand" href="#" aria-label="brand">
            <img src="./pygodide-logo.svg" alt="logo" />
          </a>
          <div id="status">Loading...</div>
          <div id="pygodide-progress" class="pygodide-progress">
            <span id="pygodide-progress-fill" class="pygodide-progress-fill"></span>
          </div>
        </div>
        <canvas
          id="canvas"
          data-canvas-layout="fixed"
          width="360"
          height="640"
          tabindex="0"
        ></canvas>
      </div>
    </main>

    <!-- Скрытое поле для вызова клавиатуры телефона -->
    <input type="text" id="mobile-nickname-input" style="position: absolute; opacity: 0; pointer-events: none; top: 0; left: 0; z-index: -1;" maxlength="15" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.0/full/pyodide.js"></script>
    <script type="module" src="./boot.js?v=a6318f5a52fb"></script>

    <script>
      // --- ЛОГИКА ДЛЯ МОБИЛЬНОГО ВВОДА НИКА ---
      const waitForGame = setInterval(() => {
        if (window.pyodide || (window.game && window.game.pyodide)) {
          clearInterval(waitForGame);
          
          const input = document.getElementById('mobile-nickname-input');
          const canvas = document.getElementById('canvas');
          
          // При касании канваса
          canvas.addEventListener('pointerdown', (e) => {
            try {
              const py = window.pyodide || window.game.pyodide;
              // Проверяем, что игра загрузилась и находится на экране ника
              if (py && py.globals.has('Game')) {
                const game_class = py.globals.get('Game');
                if (game_class && game_class._instance && game_class._instance.state === 'nickname') {
                  input.style.pointerEvents = 'auto';
                  input.style.zIndex = '100';
                  input.focus();
                }
              }
            } catch(err) {}
          });
          
          // При вводе текста в скрытое поле
          input.addEventListener('input', () => {
            try {
              const py = window.pyodide || window.game.pyodide;
              if (py && py.globals.has('Game')) {
                const game_class = py.globals.get('Game');
                if (game_class && game_class._instance && game_class._instance.state === 'nickname') {
                  game_class._instance.nickname_screen.nickname = input.value;
                }
              }
            } catch(err) {}
          });
          
          // При нажатии Enter на клавиатуре телефона
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              try {
                const py = window.pyodide || window.game.pyodide;
                if (py && py.globals.has('Game')) {
                  const game_class = py.globals.get('Game');
                  const game = game_class._instance;
                  if (game && game.state === 'nickname' && input.value.length >= 2) {
                    game.profile.nickname = input.value;
                    game.profile.first_login = false;
                    game.add_player_to_ranking();
                    game.state = "main_menu";
                    input.blur();
                    input.style.pointerEvents = 'none';
                    input.style.zIndex = '-1';
                  }
                }
              } catch(err) {}
            }
          });
          
          console.log("✅ Мобильный ввод ника готов");
        }
      }, 500);
    </script>
  </body>
</html>
